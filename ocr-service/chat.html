<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTYP AI Konsolu — ptyp-ai</title>
<style>
  :root { --bg:#0f1218; --panel:#171c26; --border:#242b3a; --text:#e6ebf4; --muted:#8b95a8; --accent:#f5a623; --user:#1d3a5f; --ai:#1c2733; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; background:var(--panel); }
  header h1 { font-size:15px; font-weight:600; }
  header .badge { font-size:11px; color:var(--muted); border:1px solid var(--border); padding:2px 8px; border-radius:999px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:78%; padding:10px 14px; border-radius:12px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; font-size:14px; }
  .msg.user { align-self:flex-end; background:var(--user); border-bottom-right-radius:4px; }
  .msg.ai { align-self:flex-start; background:var(--ai); border-bottom-left-radius:4px; border:1px solid var(--border); }
  .msg img { max-width:260px; max-height:180px; border-radius:8px; margin-bottom:6px; display:block; }
  .msg.err { align-self:flex-start; background:#3a1d1d; border:1px solid #5c2a2a; color:#ffb4b4; }
  .msg .role { font-size:10.5px; color:var(--muted); margin-bottom:3px; }
  .thinking { align-self:flex-start; color:var(--muted); font-size:13px; display:flex; gap:6px; align-items:center; }
  .thinking .dots::after { content:'…'; animation:blink 1.2s infinite; }
  @keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }
  footer { padding:12px 16px; border-top:1px solid var(--border); background:var(--panel); }
  .compose { display:flex; gap:10px; align-items:flex-end; }
  textarea { flex:1; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px; resize:none; height:44px; font-family:inherit; }
  textarea:focus { outline:1px solid var(--accent); }
  button { background:var(--accent); color:#131313; border:none; border-radius:10px; padding:0 18px; height:44px; font-weight:700; cursor:pointer; font-size:14px; }
  button:disabled { opacity:.5; cursor:default; }
  .imgbtn { background:var(--bg); color:var(--text); border:1px solid var(--border); width:44px; padding:0; font-size:18px; }
  .thumb { border:1px solid var(--accent); border-radius:8px; overflow:hidden; position:relative; }
  .thumb img { width:52px; height:52px; object-fit:cover; display:block; }
  .thumb .x { position:absolute; top:0; right:0; background:rgba(0,0,0,.7); color:#fff; width:16px; height:16px; font-size:10px; line-height:16px; text-align:center; cursor:pointer; }
  .hint { text-align:center; color:var(--muted); font-size:11.5px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <span style="font-size:18px">⚡</span>
  <h1>PTYP AI Test Konsolu</h1>
  <span class="badge" id="model">ptyp-ai</span>
  <span class="badge">text + görüntü</span>
</header>
<div id="log">
  <div class="msg ai"><span class="role">sistem</span>Merhaba! ptyp-ai (Qwen3.5-4B) ile test sohbeti. Metin yazabilir ya da 📷 ile görsel ekleyip soru sorabilirsin.</div>
</div>
<footer>
  <div class="compose">
    <input type="file" id="file" accept="image/*" style="display:none">
    <button class="imgbtn" id="imgbtn" title="Görsel ekle">📷</button>
    <textarea id="inp" placeholder="Mesaj yaz… (Enter=gönder, Shift+Enter=yeni satır)"></textarea>
    <button id="send">Gönder</button>
  </div>
  <div id="thumbwrap" style="display:none; margin-top:8px">
    <div class="thumb">
      <img id="thumb">
      <span class="x" id="clearthumb">✕</span>
    </div>
  </div>
  <div class="hint">Bu sayfa OCR servisinin içindedir (127.0.0.1:8787) — erişim SSH tüneliyle sağlanır.</div>
</footer>
<script>
const log = document.getElementById('log');
const inp = document.getElementById('inp');
const send = document.getElementById('send');
const file = document.getElementById('file');
const imgbtn = document.getElementById('imgbtn');
const thumbwrap = document.getElementById('thumbwrap');
const thumb = document.getElementById('thumb');
const clearThumb = document.getElementById('clearthumb');
let imageB64 = null;
const history = [];

function addMsg(text, cls, imgSrc) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  const role = document.createElement('span');
  role.className = 'role';
  role.textContent = cls === 'user' ? 'sen' : (cls === 'err' ? 'hata' : 'ptyp-ai');
  d.appendChild(role);
  if (imgSrc) {
    const im = document.createElement('img');
    im.src = imgSrc;
    d.appendChild(im);
  }
  const t = document.createElement('span');
  t.textContent = text;
  d.appendChild(t);
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return t; // metin span'ı — akış sırasında ekleme yapılır
}

function addThinking() {
  const d = document.createElement('div');
  d.className = 'thinking';
  d.innerHTML = 'AI düşünüyor<span class="dots"></span>';
  d.id = 'thinking';
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

imgbtn.onclick = () => file.click();
file.onchange = () => {
  const f = file.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    imageB64 = String(reader.result).split(',')[1];
    thumb.src = reader.result;
    thumbwrap.style.display = 'block';
  };
  reader.readAsDataURL(f);
};
clearThumb.onclick = () => { imageB64 = null; thumbwrap.style.display = 'none'; file.value = ''; };

async function doSend() {
  const prompt = inp.value.trim();
  if (!prompt && !imageB64) return;
  send.disabled = true;
  addMsg(prompt || '[görsel]', 'user', imageB64 ? thumb.src : null);
  const think = addThinking();
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, image: imageB64, history }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.error || ('HTTP ' + res.status));
    }
    think.remove();
    const t = addMsg('', 'ai');
    // SSE akışı: "data: {...}\n\n" karelerini oku, token'ları ekle
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    let streamDone = false;
    while (!streamDone) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, i);
        buf = buf.slice(i + 2);
        for (const line of frame.split('\n')) {
          if (!line.startsWith('data: ')) continue;
          let p;
          try { p = JSON.parse(line.slice(6)); } catch { continue; }
          if (p.error) {
            t.textContent = p.error;
            t.parentElement.className = 'msg err';
            streamDone = true;
          } else if (p.done) {
            streamDone = true;
          } else if (p.t) {
            t.textContent += p.t;
            log.scrollTop = log.scrollHeight;
          }
        }
      }
    }
    history.push({ user: prompt || '[görsel]', assistant: t.textContent });
    if (history.length > 8) history.shift();
  } catch (e) {
    think.remove();
    addMsg(e.message, 'err');
  } finally {
    send.disabled = false;
    inp.value = '';
    imageB64 = null;
    thumbwrap.style.display = 'none';
    file.value = '';
    inp.focus();
  }
}

send.onclick = doSend;
inp.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
});
</script>
</body>
</html>
